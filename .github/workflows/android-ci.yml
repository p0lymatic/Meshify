name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate media packs and rebuild catalog
        run: python3 tools/pack_catalog.py

      - name: Verify generated catalog is current
        run: git diff --exit-code -- catalog.json

      - name: Run unit tests and assemble debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload media catalog
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshify-media-catalog
          path: catalog.json

  release:
    name: Publish debug APK release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: meshify-debug-apk
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.run_number }}
        run: |
          mv release/app-debug.apk release/Meshify-debug-${TAG}.apk
          gh release create "$TAG" release/Meshify-debug-${TAG}.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Meshify debug APK ${TAG#apk-}" \
            --generate-notes
